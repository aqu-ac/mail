<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webmail</title><meta name="robots" content="noindex"><meta name="color-scheme" content="dark light">
<script>(function(){var m=null;try{m=localStorage.getItem('theme')}catch(e){}if(!m){var c=document.cookie.match(/(?:^|; )theme=(light|dark)/);if(c)m=c[1]}if(!m)m='dark';document.documentElement.dataset.theme=m})()</script>



<link rel="stylesheet" href="app.css">
</head><body>
<header id="top">
  <a class="logo" href="/" aria-label="Mail home"><span class="wm">WEBMAIL</span></a>
  <div class="tr">
    <span id="who" class="chip" hidden></span>
    <button class="tg" type="button" aria-label="Toggle dark mode">Theme</button>
    <button class="lnk" id="lo" hidden>Sign out</button>
  </div>
</header>
<div id="login" hidden>
  
  <form id="lf" class="glass" autocomplete="on">
    <h1 class="ttl">Sign in</h1>
    <p class="sub">To continue to Webmail</p>
    <label>Email address<input id="lu" name="username" type="email" autocomplete="username" placeholder="you@example.com" required></label>
    <label>Password<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <label class="keep"><input id="lk" type="checkbox"><span><b>Keep me signed in</b><small>Recommended on trusted devices only.</small></span></label>
    <button class="btn pri" type="submit">Continue</button>
    <p id="le" class="err" role="alert"></p>
    <div class="links"><p>New to Mail? <a href="#">Create account</a></p><hr><a href="#">Trouble signing in?</a></div>
  </form>
</div>
<div id="app" hidden>
  <aside id="side" class="glass">
    <button class="btn pri wide" id="cmp"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Compose</button>
    <nav id="boxes" aria-label="Folders"></nav>
  </aside>
  <section id="lst" class="glass">
    <div class="lh"><button class="lnk back" id="mb" aria-label="Folders">☰</button><h2 id="lt">Inbox</h2><button class="lnk" id="rf" title="Refresh" aria-label="Refresh">↻</button></div>
    <div class="sf"><input id="q" type="search" placeholder="Search mail" aria-label="Search mail"></div>
    <div id="rows" role="list"></div>
  </section>
  <main id="rd" class="glass"><div class="empty"><p>Select a message</p></div></main>
</div>
<div id="dlg" hidden>
  <form id="cf" class="glass card">
    <div class="hd"><b>NEW MESSAGE</b><button type="button" class="lnk" id="cx" aria-label="Close">✕</button></div>
    <input id="ct" placeholder="To" required><input id="cc" placeholder="Cc">
    <input id="cs" placeholder="Subject"><textarea id="cb" placeholder="Write your message"></textarea>
    <div class="ft"><button class="btn pri" type="submit" id="snd">Send</button><span id="cst" class="muted"></span></div>
  </form>
</div>
<script src="app.js"></script>
</body></html>
